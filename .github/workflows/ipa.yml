name: Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixtures:
    name: Parser fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fixture tests
        run: python3 scripts/verify_rumble.py

  live:
    name: Live Rumble check
    runs-on: ubuntu-latest
    # GitHub-hosted IPs are often Cloudflare-blocked by rumble.com.
    # A challenge skips the live assertions (exit 0). continue-on-error
    # keeps any other live failure from failing the workflow.
    # The IPA job must not list this job under `needs`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the Videos tab and stream resolver
        run: python3 scripts/verify_rumble.py --live

  ipa:
    name: Build unsigned IPA
    # Intentionally has no `needs:`. A failed or skipped live check must not block the IPA.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select a simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          ID="$(xcrun simctl list devices available | grep -E 'iPhone' | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $ID"
      - name: Unit tests
        run: |
          xcodebuild test \
            -project FuentesArchive.xcodeproj \
            -scheme FuentesArchive \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FuentesArchive-unsigned-ipa
          path: |
            build/FuentesArchive-unsigned.ipa
            sidestore/apps.json
          if-no-files-found: error
      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One rolling release so this URL always fetches the newest IPA:
          # https://github.com/ry-pi/fuentes-archive/releases/latest/download/FuentesArchive-unsigned.ipa
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --target "${GITHUB_SHA}" \
            --title "Latest unsigned IPA" \
            --notes "Unsigned Fuentes Archive build from ${GITHUB_SHA}. Install with SideStore. The asset name is stable: FuentesArchive-unsigned.ipa." \
            --latest \
            build/FuentesArchive-unsigned.ipa
