name: Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixtures:
    name: Parser fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fixture tests
        run: python3 scripts/verify_rumble.py

  live:
    name: Live Rumble check
    runs-on: ubuntu-latest
    # GitHub-hosted IPs are often Cloudflare-blocked by rumble.com.
    # A challenge skips the live assertions (exit 0). continue-on-error
    # keeps any other live failure from failing the workflow.
    # The IPA job must not list this job under `needs`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify the Videos tab and stream resolver
        run: python3 scripts/verify_rumble.py --live

  ipa:
    name: Build unsigned IPA
    # Intentionally has no `needs:`. A failed or skipped live check must not block the IPA.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select a simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          ID="$(xcrun simctl list devices available | grep -E 'iPhone' | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $ID"
      - name: Unit tests
        run: |
          xcodebuild test \
            -project FuentesArchive.xcodeproj \
            -scheme FuentesArchive \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: FuentesArchive-unsigned-ipa
          path: |
            build/FuentesArchive-unsigned.ipa
            sidestore/apps.json
          if-no-files-found: error
      - name: Publish versioned release + SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA=build/FuentesArchive-unsigned.ipa
          rm -rf /tmp/ipa && unzip -o -q "$IPA" 'Payload/*.app/Info.plist' -d /tmp/ipa
          PL=$(ls /tmp/ipa/Payload/*.app/Info.plist)
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PL")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PL")
          TAG="v${VER}-${BUILD}"
          echo "IPA is $VER ($BUILD) -> $TAG"
          python3 - "$VER" "$BUILD" <<'PY'
          import json, sys
          v = json.load(open("sidestore/apps.json"))["apps"][0]["versions"][0]
          if (v["version"], v["buildVersion"]) != (sys.argv[1], sys.argv[2]):
              sys.exit(f"sidestore/apps.json top entry {v['version']} ({v['buildVersion']}) does not match IPA {sys.argv[1]} ({sys.argv[2]}); bump both")
          PY
          # Versioned release (replaced if the same version is rebuilt)
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" --target "${GITHUB_SHA}" --title "Fuentes Archive $VER ($BUILD)" \
            --notes "Unsigned build from ${GITHUB_SHA}. Install via the SideStore source: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/source/apps.json" \
            --latest "$IPA"
          # Rolling alias kept for direct links
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --target "${GITHUB_SHA}" --title "Latest unsigned IPA" \
            --notes "Alias of $TAG." --latest=false "$IPA"
          # SideStore source lives on the 'source' branch (stable raw URL)
          mkdir -p /tmp/src
          python3 scripts/publish_source.py /tmp/src/apps.json --ipa "$IPA" --version "$VER" --build "$BUILD"
          cp sidestore/icon-1024.png /tmp/src/
          cd /tmp/src
          git init -q -b source
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add . && git commit -qm "SideStore source for $TAG"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
